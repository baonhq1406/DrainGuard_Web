services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: drainguard
      POSTGRES_USER: drainguard
      POSTGRES_PASSWORD: drainguard_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U drainguard -d drainguard"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
